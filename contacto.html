<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contacta a Kevin Royo, estudiante de Ingeniería de Software enfocado en backend con Java y Spring Boot.">

    <meta name="theme-color" content="#04B4E0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="assets/fonts/fontawesome-free-6.1.2-web/css/all.min.css" />
    <link rel="stylesheet" href="assets/fonts/poppins/poppins.css" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/scroll.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/extras.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />

    <script src="assets/js/menu.js" defer></script>
    <script src="assets/js/map.js" defer></script>

    <title>Contacto · Kevin Royo</title>
</head>
<body>

    <div class="layout">

        <aside class="layout__aside" id="menu-lateral">
            <section class="aside__user-info">

                <div class="user-info__general">
                    <div class="user-info__container-image">
                        <img src="assets/img/kevin.png" class="user-info__image" alt="Foto de perfil de Kevin Royo" />
                    </div>

                    <h2 class="user-info__name">Kevin Royo</h2>
                    <h4 class="user-info__job">Estudiante · Desarrollo de software</h4>
                    <span class="status-badge"><span class="status-badge__dot">●</span>&nbsp;Práctica desde inicios de 2027</span>
                </div>

                <nav class="layout__menu">
                    <ul class="menu__list">
                        <li class="menu__option">
                            <a href="index.html" class="menu__link">
                                <i class="menu__icon fa-solid fa-house"></i>
                                <span class="menu__overlay">Home</span>
                            </a>
                        </li>
                        <li class="menu__option">
                            <a href="sobre-mi.html" class="menu__link">
                                <i class="menu__icon fa-solid fa-user"></i>
                                <span class="menu__overlay">Sobre mí</span>
                            </a>
                        </li>
                        <li class="menu__option">
                            <a href="curriculum.html" class="menu__link">
                                <i class="menu__icon fa-solid fa-graduation-cap"></i>
                                <span class="menu__overlay">Curriculum</span>
                            </a>
                        </li>
                        <li class="menu__option">
                            <a href="portafolio.html" class="menu__link">
                                <i class="menu__icon fa-solid fa-briefcase"></i>
                                <span class="menu__overlay">Proyectos</span>
                            </a>
                        </li>
                        <li class="menu__option">
                            <a href="contacto.html" class="menu__link menu__link--active">
                                <i class="menu__icon fa-solid fa-envelope"></i>
                                <span class="menu__overlay">Contacto</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <div class="user-info__links">
                    <ul class="links__social">
                        <li class="social__option">
                            <a href="https://github.com/Keviin010" class="social__link" title="GitHub" target="_blank" rel="noopener">
                                <i class="social__icon fa-brands fa-github"></i>
                            </a>
                        </li>
                        <li class="social__option">
                            <a href="https://www.linkedin.com/in/kevin-royo-09a427216/" class="social__link" title="LinkedIn" target="_blank" rel="noopener">
                                <i class="social__icon fa-brands fa-linkedin"></i>
                            </a>
                        </li>
                        <li class="social__option">
                            <a href="mailto:kevd.r19@gmail.com" class="social__link" title="Correo">
                                <i class="social__icon fa-solid fa-envelope"></i>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="user-info__buttons">
                    <a href="assets/cv/Kevin_Dair_Royo_Cuesta_CV.pdf" class="user-info__btn" download>Descargar CV</a>
                </div>

                <footer class="user-info__footer">
                    &copy; 2026 Kevin Royo
                </footer>
            </section>
        </aside>

        <button type="button" class="layout__menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-lateral">
            <i class="menu-toggle__icon fa-solid fa-bars" aria-hidden="true"></i>
            <i class="menu-toggle__icon fa-solid fa-xmark" aria-hidden="true"></i>
        </button>

        <main class="layout__content">
            <section class="content__page content__contact">

                <header class="contact__header">
                    <h1 class="contact__title">Contacto</h1>
                </header>

                <div class="contact__container">

                    <div class="contact__info">
                        <article class="conctact__data">
                            <i class="contact__icon fa-solid fa-location-dot"></i>
                            <h4 class="contact__subtitle">Medellín, Colombia</h4>
                        </article>

                        <article class="conctact__data">
                            <a href="mailto:kevd.r19@gmail.com" class="contact__mail-link" title="Enviar correo">
                                <i class="contact__icon fa-solid fa-envelope"></i>
                            </a>
                            <h4 class="contact__subtitle">Escríbeme</h4>
                        </article>

                        <article class="conctact__data">
                            <i class="contact__icon fa-solid fa-graduation-cap"></i>
                            <h4 class="contact__subtitle">Práctica desde inicios de 2027</h4>
                        </article>
                    </div>

                    <div class="contact__form-box">

                        <header class="contact__form-header">
                            <h2 class="form-header__title">Envíame un <span class="title__color">mensaje</span></h2>
                        </header>

                        <form id="contact-form" class="contact__form">
                            <div class="form__container">
                                <div class="form__left">

                                    <div class="form__group">
                                        <input type="text" id="form-name" class="form__input" placeholder=" " required>
                                        <label class="form__label">Nombre</label>
                                    </div>

                                    <div class="form__group">
                                        <input type="email" id="form-email" class="form__input" placeholder=" " required>
                                        <label class="form__label">Correo</label>
                                    </div>

                                    <div class="form__group">
                                        <input type="text" id="form-subject" class="form__input" placeholder=" ">
                                        <label class="form__label">Asunto</label>
                                    </div>

                                </div>

                                <div class="form__right">
                                    <div class="form__group form__group--textarea">
                                        <textarea id="form-message" class="form__input form__input--textarea" placeholder=" " required></textarea>
                                        <label class="form__label">Mensaje</label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="form__button">Enviar mensaje</button>
                            <p id="form-status" class="form__status"></p>
                        </form>

                    </div>

                </div>

                <div class="contact__map">
                    <div id="load-iframe-map"></div>
                </div>

            </section>
        </main>
    </div>

</body>
</html>
